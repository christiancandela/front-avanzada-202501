<div class="login-container">
  <h2>Iniciar Sesión</h2>
  <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
    <div class="p-field">
      <label for="email">Correo Electrónico</label>
      <input type="text" pInputText
        id="email"
        formControlName="email"
        placeholder="Ingresa tu correo"
        [style]="{ width: '100%' }"
      />
      <small *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched" class="p-error">
        Por favor, ingresa un correo válido.
      </small>
    </div>
    <div class="p-field">
      <label for="password">Contraseña</label>
      <p-password
        id="password"
        formControlName="password"
        placeholder="Ingresa tu contraseña"
        [feedback]="false"
        [toggleMask]="true"
        [style]="{ width: '100%' }"
      ></p-password>
      <small *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched" class="p-error">
        La contraseña es requerida.
      </small>
    </div>
    <p-button
      type="submit"
      label="Iniciar Sesión"
      [disabled]="loginForm.invalid"
      styleClass="p-button-raised p-button-primary"
    ></p-button>
  </form>
</div>
